name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docusaurus/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docusaurus
    steps:
      # Only the docs site is needed; skip the Rust workspace entirely.
      - name: Checkout docusaurus only
        uses: actions/checkout@v7
        with:
          sparse-checkout: docusaurus
          filter: blob:none
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docusaurus/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docusaurus/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docusaurus/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

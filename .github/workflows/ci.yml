# **what?**
# Runs the Rust workspace CI gates for every change to `main`: formatting,
# clippy, and the workspace test suite.

# **why?**
# Runs the workspace test suite per-change so a break is attributed to the pull
# request that caused it. This is the only workflow kept from the upstream
# dbt-labs automation; release/publish workflows were removed from this fork.

# **when?**
# Only on pull requests targeting `main` that carry the `CI Trigger` label,
# plus manual dispatch. The runs are expensive, so they are opt-in per PR.
# Adding the label starts a run; later pushes re-run while it stays on.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  workflow_dispatch:

# Superseded pull request runs tell us nothing, so cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: no secrets are needed, which keeps these gates working on pull
# requests from public forks.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------
  # Formatting is a pure text check — no protoc, sccache, or cargo cache
  # needed, so it stays on the cheap runner and reports in under a minute.
  # ------------------------------------------------------------------
  fmt:
    name: Format
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI Trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI Trigger')
    runs-on: depot-ubuntu-24.04-32
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: clippy-x86_64-unknown-linux-gnu
          components: clippy

      # No `--locked`: the root Cargo.lock is not committed, so cargo has to
      # resolve and write one on a fresh checkout.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  # ------------------------------------------------------------------
  # The workspace test suite. Linux-only; tests that need live warehouse
  # credentials are `#[ignore]`d, so this needs no secrets.
  # ------------------------------------------------------------------
  test:
    name: Test workspace
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'CI Trigger')
    runs-on: depot-ubuntu-24.04-32
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: sccache
      # Load-bearing, not a tuning knob: the parser/jinja recursion overflows
      # the default thread stack, and tests like dbt-sa-cli's
      # `parse::parse_hello_world` abort with SIGABRT without this. 8 MiB.
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # actions/checkout@v4

      - uses: ./.github/actions/setup-rust-linux
        with:
          cache-key: test-x86_64-unknown-linux-gnu

      # rust-cache caches ~/.cargo/bin, so this compiles from source on a cold
      # cache only. The `--locked` here is cargo-nextest's own published
      # lockfile, unrelated to this workspace.
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      # No `--locked`: see the clippy job above.
      - name: Run tests
        run: cargo nextest run --workspace

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true
